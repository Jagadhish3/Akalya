services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/akalya-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - akalya-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/akalya-server
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    depends_on:
      - db
    networks:
      - akalya-network

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - akalya-network

networks:
  akalya-network:
    driver: bridge

volumes:
  mongodb_data:
